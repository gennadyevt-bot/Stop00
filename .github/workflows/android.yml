name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Download and install Gradle 8.10.2
      run: |
        wget -q https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -O /tmp/gradle.zip
        sudo unzip -q /tmp/gradle.zip -d /opt/
        /opt/gradle-8.10.2/bin/gradle --version

    - name: Generate Gradle Wrapper
      run: |
        /opt/gradle-8.10.2/bin/gradle wrapper --gradle-version 8.10.2
        chmod +x gradlew
        ls -la gradlew

    - name: Assemble Debug
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: app/build/outputs/apk/debug/*.apk
